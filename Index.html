<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #f4f5f7;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
      --text-sub: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 40px;
    }
    header {
      background: var(--card-bg);
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .month-nav button {
      background: var(--bg);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      color: var(--text);
    }
    .month-nav button:active { background: var(--border); }
    .month-nav .period-label {
      font-weight: 700;
      font-size: 14px;
      text-align: center;
      flex: 1;
    }
    .total-card {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border-radius: var(--radius);
      padding: 22px 20px;
      margin-bottom: 14px;
      box-shadow: 0 4px 12px rgba(37,99,235,0.25);
    }
    .total-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .total-card .label {
      font-size: 13px;
      opacity: 0.85;
    }
    .total-card .amount {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .diff-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .diff-badge.up { color: #fecaca; }
    .diff-badge.down { color: #bbf7d0; }
    .diff-badge.same { color: rgba(255,255,255,0.8); }
    .card-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .card-summary {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }
    .card-summary:active { background: var(--bg); }
    .card-summary.selected {
      border-color: var(--primary);
      background: #eff6ff;
    }
    .card-summary .name {
      font-size: 12.5px;
      color: var(--text-sub);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-summary .amount {
      font-size: 16px;
      font-weight: 700;
    }
    section.panel {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    section.panel h2 {
      font-size: 15px;
      margin: 0 0 12px 0;
    }
    .weather-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      margin-bottom: 14px;
    }
    .weather-card .icon { font-size: 40px; line-height: 1; flex-shrink: 0; }
    .weather-card .info { flex: 1; min-width: 0; }
    .weather-card .temp { font-size: 20px; font-weight: 800; }
    .weather-card .desc { font-size: 12.5px; opacity: 0.9; margin-top: 2px; }
    .weather-card .msg { font-size: 13px; font-weight: 600; margin-top: 6px; }
    .weather-card.empty {
      background: var(--bg);
      color: var(--text-sub);
      font-size: 13px;
      justify-content: center;
    }
    .stock-section-title {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 700;
      margin: 12px 0 4px;
    }
    .stock-section-title:first-child { margin-top: 0; }
    .stock-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 2px;
      border-bottom: 1px dashed var(--border);
      font-size: 13.5px;
    }
    .stock-item:last-child { border-bottom: none; }
    .stock-item .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }
    .stock-item .price {
      font-weight: 700;
      white-space: nowrap;
    }
    .stock-item .change {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      min-width: 62px;
      text-align: right;
    }
    .stock-item .change.up { color: #dc2626; }
    .stock-item .change.down { color: #2563eb; }
    details.parking-toggle[open] .parking-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .parking-btn {
      padding: 18px 8px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.05s;
    }
    .parking-btn:active { transform: scale(0.96); }
    .parking-btn.loc-2 { background: #dbeafe; color: #1d4ed8; }
    .parking-btn.loc-3 { background: #dcfce7; color: #15803d; }
    .parking-btn.loc-4 { background: #fef3c7; color: #b45309; }
    .parking-btn.loc-other { background: #f3e8ff; color: #7e22ce; }
    .parking-status {
      text-align: center;
      padding: 22px 16px;
      border-radius: var(--radius);
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }
    .parking-status .loc {
      display: block;
      font-size: 28px;
      font-weight: 800;
      margin: 4px 0 6px;
    }
    .parking-status .time {
      display: block;
      font-size: 13px;
      font-weight: 500;
      opacity: 0.9;
    }
    .parking-status.empty {
      background: var(--bg);
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 500;
    }
    .parking-status.loc-2 { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .parking-status.loc-3 { background: linear-gradient(135deg, #22c55e, #15803d); }
    .parking-status.loc-4 { background: linear-gradient(135deg, #f59e0b, #b45309); }
    .parking-status.loc-other { background: linear-gradient(135deg, #a855f7, #7e22ce); }
    .category-bars {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .cat-bar-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 5px;
    }
    .cat-bar-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cat-bar-amount {
      font-size: 12px;
      color: var(--text-sub);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .cat-bar-track {
      height: 10px;
      background: var(--bg);
      border-radius: 6px;
      overflow: hidden;
    }
    .cat-bar-fill {
      height: 100%;
      border-radius: 6px;
    }
    .form-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .form-row .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    label {
      font-size: 12.5px;
      color: var(--text-sub);
      margin-bottom: 4px;
      display: block;
    }
    input[type=text], input[type=number], input[type=date], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }
    button.primary {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }
    button.primary:active { background: var(--primary-dark); }
    button.primary:disabled { opacity: 0.6; }
    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .form-actions button.primary { margin-top: 0; flex: 1; }
    button.secondary {
      background: var(--bg);
      color: var(--text-sub);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
    }
    button.secondary:active { background: var(--border); }
    .expense-group {
      margin-bottom: 14px;
    }
    .expense-group:last-child { margin-bottom: 0; }
    .expense-group .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      font-weight: 700;
      padding: 4px 2px 8px 2px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .expense-group .group-header .group-total { color: var(--primary); }
    .expense-list {
      max-height: 420px;
      overflow-y: auto;
    }
    .expense-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 2px;
      border-bottom: 1px dashed var(--border);
    }
    .expense-item:last-child { border-bottom: none; }
    .expense-item .cat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .expense-item .date {
      font-size: 12.5px;
      color: var(--text-sub);
      width: 40px;
      flex-shrink: 0;
    }
    .expense-item .item {
      flex: 1;
      font-size: 14.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .expense-item .amount {
      font-size: 14.5px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .expense-item .edit-btn,
    .expense-item .del-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 16px;
      cursor: pointer;
      padding: 4px 6px;
      flex-shrink: 0;
    }
    .expense-item .edit-btn:active { color: var(--primary); }
    .expense-item .del-btn:active { color: var(--danger); }
    .empty-state {
      text-align: center;
      color: var(--text-sub);
      font-size: 13.5px;
      padding: 24px 0;
    }
    .card-manage-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 2px;
      border-bottom: 1px dashed var(--border);
      font-size: 14px;
    }
    .card-manage-item:last-child { border-bottom: none; }
    .card-manage-item .del-btn {
      background: var(--danger-bg);
      color: var(--danger);
      border: none;
      border-radius: 8px;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
    }
    .add-card-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .add-card-row input { flex: 1; }
    .add-card-row button {
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 13.5px;
      cursor: pointer;
    }
    details.manage-toggle summary {
      cursor: pointer;
      font-size: 13.5px;
      color: var(--text-sub);
      list-style: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    details.manage-toggle summary::-webkit-details-marker { display: none; }
    details.manage-toggle[open] summary { margin-bottom: 10px; }
    details.parking-toggle summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    details.parking-toggle summary::-webkit-details-marker { display: none; }
    details.parking-toggle summary::after {
      content: '▾';
      color: var(--text-sub);
      font-size: 13px;
      transition: transform 0.15s;
    }
    details.parking-toggle[open] summary::after { transform: rotate(180deg); }
    details.parking-toggle[open] summary { margin-bottom: 12px; }
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f2937;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13.5px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 50;
      max-width: 90%;
      text-align: center;
    }
    #toast.show { opacity: 1; }
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--text-sub);
      z-index: 100;
    }
    .loading-overlay.show { display: flex; }
  </style>
</head>
<body>
  <header>
    <h1>💳 우리가족 카드 사용 현황</h1>
  </header>

  <div class="container">
    <section class="panel">
      <details class="parking-toggle" id="parkingDetails">
        <summary><span id="parkingSummaryLabel">🚗 주차 위치 기록</span></summary>
        <div class="weather-card empty" id="weatherCard">불러오는 중...</div>
        <div class="parking-buttons">
          <button type="button" class="parking-btn loc-2" data-loc="지하2층">지하2층</button>
          <button type="button" class="parking-btn loc-3" data-loc="지하3층">지하3층</button>
          <button type="button" class="parking-btn loc-4" data-loc="지하4층">지하4층</button>
          <button type="button" class="parking-btn loc-other" data-loc="다른곳">다른곳</button>
        </div>
        <div class="parking-status empty" id="parkingStatus">불러오는 중...</div>
      </details>
    </section>

    <div class="month-nav">
      <button id="prevBtn" aria-label="이전 달">‹</button>
      <div class="period-label" id="periodLabel">불러오는 중...</div>
      <button id="nextBtn" aria-label="다음 달">›</button>
    </div>

    <div class="total-card">
      <div class="total-card-top">
        <div class="label">이번 정산월 총 지출</div>
        <div class="diff-badge" id="diffBadge"></div>
      </div>
      <div class="amount" id="grandTotal">0원</div>
    </div>

    <div class="card-summary-grid" id="cardSummaryGrid"></div>

    <section class="panel">
      <h2>카테고리별 지출</h2>
      <div id="categoryChartWrap">
        <div class="empty-state">불러오는 중...</div>
      </div>
    </section>

    <section class="panel">
      <h2 id="expenseFormTitle">지출 내역 입력</h2>
      <form id="expenseForm" class="form-row">
        <div>
          <label for="cardSelect">카드 선택</label>
          <select id="cardSelect" required></select>
        </div>
        <div class="two-col">
          <div>
            <label for="dateInput">사용일</label>
            <input type="date" id="dateInput" required>
          </div>
          <div>
            <label for="amountInput">금액</label>
            <input type="number" id="amountInput" placeholder="0" min="0" step="1" required>
          </div>
        </div>
        <div>
          <label for="categorySelect">카테고리</label>
          <select id="categorySelect" required></select>
        </div>
        <div>
          <label for="itemInput">항목</label>
          <input type="text" id="itemInput" placeholder="예: 이마트 장보기" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="primary" id="submitBtn">추가하기</button>
          <button type="button" class="secondary" id="cancelEditBtn" style="display:none;">취소</button>
        </div>
      </form>
    </section>

    <section class="panel" id="expensePanel">
      <h2 style="display:flex;align-items:center;justify-content:space-between;">
        <span>지출 내역</span>
        <span id="filterClear" style="display:none;font-size:12.5px;color:var(--primary);cursor:pointer;font-weight:500;">전체보기 ✕</span>
      </h2>
      <div id="expenseListWrap">
        <div class="empty-state">불러오는 중...</div>
      </div>
    </section>

    <section class="panel">
      <details class="parking-toggle">
        <summary><span>📈 주식 시세</span></summary>
        <div id="stockWrap" class="empty-state">불러오는 중...</div>
      </details>
    </section>

    <section class="panel">
      <details class="manage-toggle">
        <summary>⚙️ 카드 관리</summary>
        <div id="cardManageList"></div>
        <div class="add-card-row">
          <input type="text" id="newCardName" placeholder="새 카드 이름 입력">
          <button id="addCardBtn" type="button">추가</button>
        </div>
      </details>
    </section>
  </div>

  <div id="toast"></div>
  <div class="loading-overlay" id="loadingOverlay">처리 중...</div>

  <script>
    var state = null;
    var selectedCardId = null;
    var editingId = null;
    var CATEGORY_COLORS = ['#2563eb', '#16a34a', '#f59e0b', '#dc2626', '#7c3aed', '#0891b2', '#db2777', '#65a30d', '#ea580c', '#64748b'];
    var PARKING_CLASS = { '지하2층': 'loc-2', '지하3층': 'loc-3', '지하4층': 'loc-4', '다른곳': 'loc-other' };

    function categoryColor(cat) {
      var idx = (state && state.categories) ? state.categories.indexOf(cat) : -1;
      if (idx === -1) idx = 0;
      return CATEGORY_COLORS[idx % CATEGORY_COLORS.length];
    }

    function fmtWon(n) {
      return Math.round(n).toLocaleString('ko-KR') + '원';
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function () { t.classList.remove('show'); }, 2200);
    }

    function setLoading(on) {
      document.getElementById('loadingOverlay').classList.toggle('show', on);
    }

    function cardNameById(id) {
      var c = state.cards.find(function (c) { return c.id === id; });
      return c ? c.name : '(삭제된 카드)';
    }

    function loadMonth(billingKey) {
      setLoading(true);
      google.script.run
        .withSuccessHandler(function (data) {
          state = data;
          render();
          setLoading(false);
          if (!editingId) {
            document.getElementById('dateInput').value = defaultDateForKey(data.billingKey);
          }
        })
        .withFailureHandler(function (err) {
          setLoading(false);
          showToast('불러오기 실패: ' + err.message);
        })
        .getMonthData(billingKey);
    }

    function defaultDateForKey(key) {
      var today = new Date();
      var todayKey = key;
      var parts = key.split('-');
      var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
      // 오늘이 이 정산월에 포함되면 오늘 날짜, 아니면 정산월 시작일(11일)로 기본값 설정
      var start = new Date(y, m - 1, 11);
      var end = new Date(y, m, 10, 23, 59, 59);
      if (today >= start && today <= end) {
        return today.toISOString().slice(0, 10);
      }
      return start.toISOString().slice(0, 10);
    }

    function render() {
      document.getElementById('periodLabel').textContent = state.periodLabel;
      document.getElementById('grandTotal').textContent = fmtWon(state.grandTotal);
      renderDiffBadge();

      if (selectedCardId && !state.cards.some(function (c) { return c.id === selectedCardId; })) {
        selectedCardId = null;
      }

      renderCardSummaryGrid();
      renderCategoryChart();

      var select = document.getElementById('cardSelect');
      var prevValue = select.value;
      select.innerHTML = '';
      state.cards.forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        select.appendChild(opt);
      });
      if (prevValue && state.cards.some(function (c) { return c.id === prevValue; })) {
        select.value = prevValue;
      }

      var catSelect = document.getElementById('categorySelect');
      var prevCat = catSelect.value;
      catSelect.innerHTML = '';
      (state.categories || []).forEach(function (cat) {
        var opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
      });
      if (prevCat && state.categories.indexOf(prevCat) !== -1) {
        catSelect.value = prevCat;
      }

      renderExpenseList();
      renderCardManageList();
    }

    function renderDiffBadge() {
      var el = document.getElementById('diffBadge');
      var prev = state.prevGrandTotal || 0;
      var diff = state.grandTotal - prev;
      if (diff === 0) {
        el.textContent = '전월과 동일';
        el.className = 'diff-badge same';
        return;
      }
      var arrow = diff > 0 ? '▲' : '▼';
      el.textContent = arrow + ' ' + fmtWon(Math.abs(diff)) + ' 전월대비';
      el.className = 'diff-badge ' + (diff > 0 ? 'up' : 'down');
    }

    function renderCategoryChart() {
      var wrap = document.getElementById('categoryChartWrap');
      var cats = state.categories || [];
      var entries = cats.map(function (cat, idx) {
        return { cat: cat, amount: state.totalsByCategory[cat] || 0, color: CATEGORY_COLORS[idx % CATEGORY_COLORS.length] };
      }).filter(function (e) { return e.amount > 0; })
        .sort(function (a, b) { return b.amount - a.amount; });

      var total = entries.reduce(function (sum, e) { return sum + e.amount; }, 0);
      if (!total) {
        wrap.innerHTML = '<div class="empty-state">이번 정산월에 등록된 내역이 없습니다.</div>';
        return;
      }

      var maxAmount = entries[0].amount;
      var rowsHtml = entries.map(function (e) {
        var pct = Math.round(e.amount / total * 100);
        var barWidth = Math.max(4, Math.round(e.amount / maxAmount * 100));
        return '<div class="category-bar-row">' +
          '<div class="cat-bar-top">' +
            '<span class="cat-bar-name">' + escapeHtml(e.cat) + '</span>' +
            '<span class="cat-bar-amount">' + fmtWon(e.amount) + ' · ' + pct + '%</span>' +
          '</div>' +
          '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:' + barWidth + '%;background:' + e.color + ';"></div></div>' +
          '</div>';
      }).join('');

      wrap.innerHTML = '<div class="category-bars">' + rowsHtml + '</div>';
    }

    function renderCardSummaryGrid() {
      var grid = document.getElementById('cardSummaryGrid');
      grid.innerHTML = '';
      state.cards.forEach(function (c) {
        var el = document.createElement('div');
        el.className = 'card-summary' + (c.id === selectedCardId ? ' selected' : '');
        el.innerHTML = '<div class="name">' + escapeHtml(c.name) + '</div><div class="amount">' + fmtWon(state.totalsByCard[c.id] || 0) + '</div>';
        el.addEventListener('click', function () {
          selectedCardId = (selectedCardId === c.id) ? null : c.id;
          renderCardSummaryGrid();
          renderExpenseList();
          if (selectedCardId) {
            document.getElementById('cardSelect').value = c.id;
            document.getElementById('expenseForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
            document.getElementById('amountInput').focus();
          }
        });
        grid.appendChild(el);
      });
    }

    function renderExpenseList() {
      var wrap = document.getElementById('expenseListWrap');
      var filterClear = document.getElementById('filterClear');
      filterClear.style.display = selectedCardId ? 'inline' : 'none';

      var cardsToShow = selectedCardId
        ? state.cards.filter(function (c) { return c.id === selectedCardId; })
        : state.cards;

      var byCard = {};
      state.cards.forEach(function (c) { byCard[c.id] = []; });
      state.expenses.forEach(function (e) {
        if (!byCard[e.cardId]) byCard[e.cardId] = [];
        byCard[e.cardId].push(e);
      });

      var hasAny = cardsToShow.some(function (c) { return (byCard[c.id] || []).length > 0; });
      if (!hasAny) {
        wrap.innerHTML = '<div class="empty-state">' +
          (selectedCardId ? '이 카드의 이번 정산월 내역이 없습니다.' : '이번 정산월에 등록된 내역이 없습니다.') +
          '</div>';
        return;
      }

      var html = '';
      cardsToShow.forEach(function (c) {
        var items = byCard[c.id] || [];
        if (!items.length) return;
        html += '<div class="expense-group">';
        html += '<div class="group-header"><span>' + escapeHtml(c.name) + '</span><span class="group-total">' + fmtWon(state.totalsByCard[c.id] || 0) + '</span></div>';
        html += '<div class="expense-list">';
        items.forEach(function (e) {
          html += '<div class="expense-item">' +
            '<span class="cat-dot" style="background:' + categoryColor(e.category) + '" title="' + escapeHtml(e.category || '기타') + '"></span>' +
            '<span class="date">' + e.dateLabel + '</span>' +
            '<span class="item">' + escapeHtml(e.item) + '</span>' +
            '<span class="amount">' + fmtWon(e.amount) + '</span>' +
            '<button class="edit-btn" data-id="' + e.id + '" aria-label="수정">✎</button>' +
            '<button class="del-btn" data-id="' + e.id + '" aria-label="삭제">✕</button>' +
            '</div>';
        });
        html += '</div></div>';
      });
      wrap.innerHTML = html;

      wrap.querySelectorAll('.edit-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          var exp = state.expenses.find(function (e) { return e.id === id; });
          if (exp) enterEditMode(exp);
        });
      });

      wrap.querySelectorAll('.del-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          if (!confirm('이 내역을 삭제할까요?')) return;
          setLoading(true);
          google.script.run
            .withSuccessHandler(function () {
              if (editingId === id) exitEditMode();
              loadMonth(state.billingKey);
            })
            .withFailureHandler(function (err) {
              setLoading(false);
              showToast('삭제 실패: ' + err.message);
            })
            .deleteExpense(id);
        });
      });
    }

    function enterEditMode(exp) {
      editingId = exp.id;
      document.getElementById('cardSelect').value = exp.cardId;
      document.getElementById('dateInput').value = exp.dateISO;
      document.getElementById('categorySelect').value = exp.category || '기타';
      document.getElementById('itemInput').value = exp.item;
      document.getElementById('amountInput').value = exp.amount;
      document.getElementById('submitBtn').textContent = '수정 완료';
      document.getElementById('cancelEditBtn').style.display = 'inline-block';
      document.getElementById('expenseFormTitle').textContent = '지출 내역 수정';
      document.getElementById('expenseForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function exitEditMode() {
      editingId = null;
      document.getElementById('itemInput').value = '';
      document.getElementById('amountInput').value = '';
      document.getElementById('submitBtn').textContent = '추가하기';
      document.getElementById('cancelEditBtn').style.display = 'none';
      document.getElementById('expenseFormTitle').textContent = '지출 내역 입력';
    }

    function renderCardManageList() {
      var wrap = document.getElementById('cardManageList');
      wrap.innerHTML = '';
      state.cards.forEach(function (c) {
        var row = document.createElement('div');
        row.className = 'card-manage-item';
        row.innerHTML = '<span>' + escapeHtml(c.name) + '</span><button class="del-btn" data-id="' + c.id + '">삭제</button>';
        wrap.appendChild(row);
      });
      wrap.querySelectorAll('.del-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          var name = cardNameById(id);
          if (!confirm('"' + name + '" 카드를 삭제할까요?')) return;
          setLoading(true);
          google.script.run
            .withSuccessHandler(function () {
              loadMonth(state.billingKey);
              showToast('카드를 삭제했습니다.');
            })
            .withFailureHandler(function (err) {
              setLoading(false);
              showToast(err.message);
            })
            .deleteCard(id);
        });
      });
    }

    function renderParkingStatus(status) {
      var el = document.getElementById('parkingStatus');
      var summaryLabel = document.getElementById('parkingSummaryLabel');
      if (!status) {
        el.className = 'parking-status empty';
        el.textContent = '아직 기록된 주차 위치가 없습니다.';
        if (summaryLabel) summaryLabel.textContent = '🚗 주차 위치 기록';
        return;
      }
      el.className = 'parking-status ' + (PARKING_CLASS[status.location] || 'loc-other');
      el.innerHTML = '현재 차량 위치는' +
        '<span class="loc">' + escapeHtml(status.location) + '</span>입니다.' +
        '<span class="time">기록시간: ' + escapeHtml(status.recordedAtLabel) + ' 현재</span>';
      if (summaryLabel) summaryLabel.textContent = '🚗 ' + status.location + ' · ' + status.recordedAtLabel;
    }

    function loadParkingStatus() {
      google.script.run
        .withSuccessHandler(renderParkingStatus)
        .withFailureHandler(function () {
          var el = document.getElementById('parkingStatus');
          el.className = 'parking-status empty';
          el.textContent = '주차 정보를 불러오지 못했습니다.';
        })
        .getParkingStatus();
    }

    document.querySelectorAll('.parking-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var loc = btn.getAttribute('data-loc');
        setLoading(true);
        google.script.run
          .withSuccessHandler(function (status) {
            setLoading(false);
            renderParkingStatus(status);
            showToast('주차 위치를 기록했습니다.');
          })
          .withFailureHandler(function (err) {
            setLoading(false);
            showToast(err.message);
          })
          .setParkingLocation(loc);
      });
    });

    function renderWeather(info) {
      var el = document.getElementById('weatherCard');
      if (!info) {
        el.className = 'weather-card empty';
        el.textContent = '날씨 정보를 불러오지 못했습니다.';
        return;
      }
      el.className = 'weather-card';
      el.innerHTML =
        '<div class="icon">' + info.icon + '</div>' +
        '<div class="info">' +
          '<div class="temp">' + info.tempC + '°C · ' + escapeHtml(info.label) + '</div>' +
          '<div class="desc">오늘 강수확률 ' + info.precipProbability + '%</div>' +
          '<div class="msg">' + escapeHtml(info.message) + '</div>' +
        '</div>';
    }

    function loadWeather() {
      google.script.run
        .withSuccessHandler(renderWeather)
        .withFailureHandler(function () { renderWeather(null); })
        .getWeatherInfo();
    }

    function renderStockList(list, currency) {
      return list.map(function (s) {
        if (s.error) {
          return '<div class="stock-item"><span class="name">' + escapeHtml(s.name) + '</span><span class="change">정보 없음</span></div>';
        }
        var priceStr = currency === 'KRW'
          ? Math.round(s.price).toLocaleString('ko-KR') + '원'
          : '$' + s.price.toFixed(2);
        var pct = Math.abs(s.changePercent).toFixed(2);
        var arrow = s.isUp ? '▲' : '▼';
        var cls = s.isUp ? 'up' : 'down';
        return '<div class="stock-item">' +
          '<span class="name">' + escapeHtml(s.name) + '</span>' +
          '<span class="price">' + priceStr + '</span>' +
          '<span class="change ' + cls + '">' + arrow + ' ' + pct + '%</span>' +
          '</div>';
      }).join('');
    }

    function renderStocks(data) {
      var el = document.getElementById('stockWrap');
      if (!data) {
        el.className = 'empty-state';
        el.textContent = '주식 정보를 불러오지 못했습니다.';
        return;
      }
      el.className = '';
      var krAsOf = data.krAsOf ? ' (기준 ' + data.krAsOf + ')' : '';
      var globalAsOf = data.globalAsOf ? ' (기준 ' + data.globalAsOf + ')' : '';
      el.innerHTML =
        '<div class="stock-section-title">🇰🇷 국내 시총 TOP 5' + escapeHtml(krAsOf) + '</div>' +
        renderStockList(data.kr, 'KRW') +
        '<div class="stock-section-title">🌎 해외 시총 TOP 10' + escapeHtml(globalAsOf) + '</div>' +
        renderStockList(data.global, 'USD') +
        '<div class="empty-state" style="padding:8px 0 0;font-size:11.5px;">휴장 시간에는 마지막 거래가가 표시돼요</div>';
    }

    function loadStocks() {
      google.script.run
        .withSuccessHandler(renderStocks)
        .withFailureHandler(function () { renderStocks(null); })
        .getStockInfo();
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    document.getElementById('filterClear').addEventListener('click', function () {
      selectedCardId = null;
      renderCardSummaryGrid();
      renderExpenseList();
    });

    document.getElementById('prevBtn').addEventListener('click', function () {
      exitEditMode();
      loadMonth(state.prevKey);
    });
    document.getElementById('nextBtn').addEventListener('click', function () {
      exitEditMode();
      loadMonth(state.nextKey);
    });

    document.getElementById('cancelEditBtn').addEventListener('click', function () {
      exitEditMode();
    });

    document.getElementById('expenseForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var cardId = document.getElementById('cardSelect').value;
      var date = document.getElementById('dateInput').value;
      var category = document.getElementById('categorySelect').value;
      var item = document.getElementById('itemInput').value;
      var amount = document.getElementById('amountInput').value;
      var submitBtn = document.getElementById('submitBtn');
      var wasEditing = !!editingId;
      var idBeingEdited = editingId;
      submitBtn.disabled = true;
      setLoading(true);

      var runner = google.script.run
        .withSuccessHandler(function () {
          exitEditMode();
          submitBtn.disabled = false;
          showToast(wasEditing ? '내역을 수정했습니다.' : '내역이 추가되었습니다.');
          loadMonth(state.billingKey);
        })
        .withFailureHandler(function (err) {
          submitBtn.disabled = false;
          setLoading(false);
          showToast(err.message);
        });

      if (wasEditing) {
        runner.updateExpense(idBeingEdited, cardId, date, item, amount, category);
      } else {
        runner.addExpense(cardId, date, item, amount, category);
      }
    });

    document.getElementById('addCardBtn').addEventListener('click', function () {
      var input = document.getElementById('newCardName');
      var name = input.value.trim();
      if (!name) return;
      setLoading(true);
      google.script.run
        .withSuccessHandler(function () {
          input.value = '';
          loadMonth(state.billingKey);
          showToast('카드를 추가했습니다.');
        })
        .withFailureHandler(function (err) {
          setLoading(false);
          showToast(err.message);
        })
        .addCard(name);
    });

    loadMonth(null);
    loadParkingStatus();
    loadWeather();
    loadStocks();
  </script>
</body>
</html>
